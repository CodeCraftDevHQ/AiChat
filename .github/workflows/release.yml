name: Release

# Push a tag like v1.2.0 to build the Windows installer and the Android APK and attach them to a GitHub Release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version
        id: v
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || V="0.0.0-dev"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: dotnet workload install maui
      - name: Publish (win-x64)
        run: dotnet publish AiChat.csproj -f net10.0-windows10.0.19041.0 -c Release -o publish/win-x64 -p:ApplicationDisplayVersion=${{ steps.v.outputs.version }}
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.v.outputs.version }}" installer\AiChat.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - run: dotnet workload install maui-android
      - name: Keystore
        id: ks
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Optional repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
          # Without them a throw-away key is made (the APK installs, but updates over an older build need the same key).
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "pass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "alias=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
          else
            keytool -genkey -v -keystore "$RUNNER_TEMP/release.keystore" -alias aichat -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass aichat-ci-pass -keypass aichat-ci-pass -dname "CN=AiChat"
            echo "pass=aichat-ci-pass" >> "$GITHUB_OUTPUT"
            echo "alias=aichat" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish APK
        run: >
          dotnet publish AiChat.csproj -f net10.0-android -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ runner.temp }}/release.keystore
          -p:AndroidSigningStorePass=${{ steps.ks.outputs.pass }}
          -p:AndroidSigningKeyAlias=${{ steps.ks.outputs.alias }}
          -p:AndroidSigningKeyPass=${{ steps.ks.outputs.pass }}
          -o publish/android
      - name: Rename
        run: cp publish/android/*-Signed.apk AiChat-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: AiChat-android.apk

  release:
    needs: [ windows, android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
